name: CampusLoop CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      deploy_aci:
        description: Deploy to Azure Container Instances
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest backend/test_main.py -q

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

  build-smoke:
    runs-on: ubuntu-latest
    needs:
      - test
      - scan
    steps:
      - uses: actions/checkout@v4
      - name: Build API, UI, and proxy images
        run: |
          docker compose build campusloop-api campusloop-ui
          printf '%s\n' 'FROM nginx:1.27-alpine' 'COPY nginx.conf /etc/nginx/templates/default.conf.template' > /tmp/campusloop-proxy.Dockerfile
          docker build -f /tmp/campusloop-proxy.Dockerfile -t campusloop-proxy:ci nginx
      - name: Smoke test Compose routes
        run: |
          set -eu
          cleanup() {
            docker compose down --remove-orphans
          }
          trap cleanup EXIT
          docker compose up --build -d
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          for page in / /index.html /valuation.html /marketplace.html /trustlend.html /dealer-pool.html; do
            curl --fail --silent "http://localhost:3000$page" >/dev/null
          done

  publish:
    runs-on: ubuntu-latest
    needs:
      - test
      - scan
      - build-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish Docker Hub images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -eu
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Docker Hub publishing skipped because registry credentials are not configured."
            exit 0
          fi
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          docker build -t "$DOCKERHUB_USERNAME/campusloop-api:$IMAGE_TAG" -t "$DOCKERHUB_USERNAME/campusloop-api:latest" backend
          docker build -t "$DOCKERHUB_USERNAME/campusloop-ui:$IMAGE_TAG" -t "$DOCKERHUB_USERNAME/campusloop-ui:latest" frontend
          printf '%s\n' 'FROM nginx:1.27-alpine' 'COPY nginx.conf /etc/nginx/templates/default.conf.template' > /tmp/campusloop-proxy.Dockerfile
          docker build -f /tmp/campusloop-proxy.Dockerfile -t "$DOCKERHUB_USERNAME/campusloop-proxy:$IMAGE_TAG" -t "$DOCKERHUB_USERNAME/campusloop-proxy:latest" nginx
          docker push "$DOCKERHUB_USERNAME/campusloop-api:$IMAGE_TAG"
          docker push "$DOCKERHUB_USERNAME/campusloop-api:latest"
          docker push "$DOCKERHUB_USERNAME/campusloop-ui:$IMAGE_TAG"
          docker push "$DOCKERHUB_USERNAME/campusloop-ui:latest"
          docker push "$DOCKERHUB_USERNAME/campusloop-proxy:$IMAGE_TAG"
          docker push "$DOCKERHUB_USERNAME/campusloop-proxy:latest"
          docker logout
      - name: Build and publish ACR images
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -eu
          if [ -z "$ACR_LOGIN_SERVER" ] || [ -z "$ACR_USERNAME" ] || [ -z "$ACR_PASSWORD" ]; then
            echo "ACR publishing skipped because registry credentials are not configured."
            exit 0
          fi
          printf '%s' "$ACR_PASSWORD" | docker login "$ACR_LOGIN_SERVER" --username "$ACR_USERNAME" --password-stdin
          docker build -t "$ACR_LOGIN_SERVER/campusloop-api:$IMAGE_TAG" -t "$ACR_LOGIN_SERVER/campusloop-api:latest" backend
          docker build -t "$ACR_LOGIN_SERVER/campusloop-ui:$IMAGE_TAG" -t "$ACR_LOGIN_SERVER/campusloop-ui:latest" frontend
          printf '%s\n' 'FROM nginx:1.27-alpine' 'COPY nginx.conf /etc/nginx/templates/default.conf.template' > /tmp/campusloop-proxy.Dockerfile
          docker build -f /tmp/campusloop-proxy.Dockerfile -t "$ACR_LOGIN_SERVER/campusloop-proxy:$IMAGE_TAG" -t "$ACR_LOGIN_SERVER/campusloop-proxy:latest" nginx
          docker push "$ACR_LOGIN_SERVER/campusloop-api:$IMAGE_TAG"
          docker push "$ACR_LOGIN_SERVER/campusloop-api:latest"
          docker push "$ACR_LOGIN_SERVER/campusloop-ui:$IMAGE_TAG"
          docker push "$ACR_LOGIN_SERVER/campusloop-ui:latest"
          docker push "$ACR_LOGIN_SERVER/campusloop-proxy:$IMAGE_TAG"
          docker push "$ACR_LOGIN_SERVER/campusloop-proxy:latest"
          docker logout "$ACR_LOGIN_SERVER"

  deploy-aci:
    runs-on: ubuntu-latest
    needs: build-smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_aci == true }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment credentials
        id: credentials
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          ACR_NAME: ${{ secrets.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          RESOURCE_GROUP: ${{ secrets.ACI_RESOURCE_GROUP }}
          ACI_NAME: ${{ secrets.ACI_NAME }}
          DNS_LABEL: ${{ secrets.ACI_DNS_LABEL }}
          STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          FILE_SHARE: ${{ secrets.AZURE_FILE_SHARE }}
        run: |
          set -eu
          if [ -z "$AZURE_CREDENTIALS" ] || [ -z "$ACR_NAME" ] || [ -z "$ACR_LOGIN_SERVER" ] || [ -z "$ACR_USERNAME" ] || [ -z "$ACR_PASSWORD" ] || [ -z "$RESOURCE_GROUP" ] || [ -z "$ACI_NAME" ] || [ -z "$DNS_LABEL" ] || [ -z "$STORAGE_ACCOUNT" ] || [ -z "$STORAGE_KEY" ] || [ -z "$FILE_SHARE" ]; then
            echo "ACI deployment skipped because required credentials are not configured."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: azure/login@v2
        if: steps.credentials.outputs.ready == 'true'
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Create ACI container group
        if: steps.credentials.outputs.ready == 'true'
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          RESOURCE_GROUP: ${{ secrets.ACI_RESOURCE_GROUP }}
          ACI_NAME: ${{ secrets.ACI_NAME }}
          DNS_LABEL: ${{ secrets.ACI_DNS_LABEL }}
          STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          FILE_SHARE: ${{ secrets.AZURE_FILE_SHARE }}
        run: |
          set -eu
          python - <<'PY'
          import json
          import os
          image_root = os.environ['ACR_LOGIN_SERVER']
          image_tag = 'latest'
          registry = {
              'server': os.environ['ACR_LOGIN_SERVER'],
              'username': os.environ['ACR_USERNAME'],
              'password': os.environ['ACR_PASSWORD'],
          }
          def container(name, image, port, env=None, mounts=None):
              result = {
                  'name': name,
                  'image': image,
                  'ports': [{'port': port, 'protocol': 'TCP'}],
                  'resources': {'requests': {'cpu': 1, 'memoryInGB': 1}},
              }
              if env:
                  result['environmentVariables'] = [{'name': key, 'value': value} for key, value in env.items()]
              if mounts:
                  result['volumeMounts'] = mounts
              return result
          config = {
              'apiVersion': '2021-10-01',
              'location': os.environ.get('AZURE_LOCATION', 'eastus'),
              'name': os.environ['ACI_NAME'],
              'type': 'Microsoft.ContainerInstance/containerGroups',
              'properties': {
                  'osType': 'Linux',
                  'restartPolicy': 'Always',
                  'imageRegistryCredentials': [registry],
                  'ipAddress': {
                      'type': 'Public',
                      'dnsNameLabel': os.environ['DNS_LABEL'],
                      'ports': [{'protocol': 'TCP', 'port': 80}],
                  },
                  'containers': [
                      container('campusloop-api', f'{image_root}/campusloop-api:{image_tag}', 8000, {'DATABASE_URL': 'sqlite:////data/campusloop.db'}, [{'name': 'campusloop-data', 'mountPath': '/data'}]),
                      container('campusloop-ui', f'{image_root}/campusloop-ui:{image_tag}', 8080),
                      container('campusloop-proxy', f'{image_root}/campusloop-proxy:{image_tag}', 80, {'API_UPSTREAM': '127.0.0.1:8000', 'UI_UPSTREAM': '127.0.0.1:8080'}),
                  ],
                  'volumes': [{'name': 'campusloop-data', 'azureFile': {'shareName': os.environ['FILE_SHARE'], 'storageAccountName': os.environ['STORAGE_ACCOUNT'], 'storageAccountKey': os.environ['STORAGE_KEY']}}],
              },
          }
          with open('/tmp/campusloop-aci.json', 'w', encoding='utf-8') as output:
              json.dump(config, output)
          PY
          az container create --resource-group "$RESOURCE_GROUP" --file /tmp/campusloop-aci.json --only-show-errors
