<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
<title id="title">CampusLoop five-page light interface mockup</title>
<desc id="desc">Standalone editable desktop and mobile artboards for Home, Valuation, Marketplace, TrustLend, and Dealer Pool, using a warm light palette and simulated-demo boundaries.</desc>
<style>
:root{--canvas:#f6f5ef;--surface:#ffffff;--sand:#eeeae0;--sage:#dce9df;--teal:#31796f;--ink:#243630;--muted:#65756f;--line:#d8dfd9;--coral:#c76f5e;--white:#ffffff}svg{color:var(--ink);font-family:Arial,sans-serif}.heading{font-size:19px;font-weight:700;fill:currentColor}.label{font-size:12px;font-weight:700;fill:currentColor}.body{font-size:10px;fill:var(--muted)}.tiny{font-size:8px;fill:var(--muted)}.brand{font-size:14px;font-weight:700;fill:var(--teal)}.card{fill:var(--surface);stroke:var(--line);stroke-width:1}.soft{fill:var(--sand)}.accent{fill:var(--sage)}.button{fill:var(--teal)}.buttontext{font-size:9px;font-weight:700;fill:var(--white)}.badge{fill:var(--sage)}.warn{fill:var(--coral)}.outline{fill:none;stroke:var(--line);stroke-width:1}
</style>
<text x="40" y="38" class="heading">CampusLoop · Light product layouts</text><text x="40" y="57" class="body">Editable vector groups · warm canvas / white cards / sage + teal accents · home loop is a scroll-driven SVG illustration with a static four-path fallback · all IDs and transactions are demo-only</text>
<g id="desktop-artboards">
<g id="desktop-home" transform="translate(40 82)"><text x="0" y="0" class="label">DESKTOP / HOME</text><rect x="0" y="14" width="330" height="398" rx="14" class="card"/><text x="16" y="40" class="brand">campusloop</text><text x="153" y="39" class="tiny">Valuation　Marketplace　TrustLend　Dealer pool</text><rect x="16" y="57" width="298" height="150" rx="10" class="accent"/><text x="31" y="87" class="tiny">CAMPUS RESOURCES, IN A BETTER LOOP</text><text x="31" y="120" class="heading">Good things keep</text><text x="31" y="143" class="heading">going.</text><text x="31" y="165" class="body">Pass on what you no longer need. Find what your next semester needs.</text><rect x="31" y="178" width="97" height="20" rx="5" class="button"/><text x="42" y="192" class="buttontext">Explore the loop</text><text x="16" y="233" class="label">Four ways to keep value moving</text><rect x="16" y="245" width="142" height="58" rx="7" class="soft"/><text x="27" y="266" class="label">Senior Resale</text><text x="27" y="283" class="tiny">Pass goods on at an estimate</text><rect x="172" y="245" width="142" height="58" rx="7" class="soft"/><text x="183" y="266" class="label">Day Transfer</text><text x="183" y="283" class="tiny">Short-use item transfer</text><rect x="16" y="313" width="142" height="58" rx="7" class="soft"/><text x="27" y="334" class="label">TrustLend</text><text x="27" y="351" class="tiny">Borrow with clear due time</text><rect x="172" y="313" width="142" height="58" rx="7" class="soft"/><text x="183" y="334" class="label">Dealer Pool</text><text x="183" y="351" class="tiny">Compare bids; allocation simulated</text><text x="16" y="394" class="tiny">No real identity verification or payment transfer.</text></g>
<g id="desktop-valuation" transform="translate(390 82)"><text x="0" y="0" class="label">DESKTOP / VALUATION</text><rect x="0" y="14" width="330" height="398" rx="14" class="card"/><text x="16" y="40" class="brand">campusloop　/　Valuation</text><text x="16" y="72" class="heading">One item. Clear paths.</text><text x="16" y="91" class="body">Estimates update from item details.</text><rect x="16" y="104" width="142" height="35" rx="6" class="soft"/><text x="27" y="119" class="tiny">CATEGORY</text><text x="27" y="132" class="label">Academic Book ▾</text><rect x="172" y="104" width="142" height="35" rx="6" class="soft"/><text x="183" y="119" class="tiny">CONDITION</text><text x="183" y="132" class="label">Mint ▾</text><text x="16" y="162" class="tiny">ORIGINAL PRICE ₹</text><rect x="16" y="169" width="142" height="29" rx="5" class="outline"/><text x="27" y="188" class="body">₹1,000</text><text x="172" y="162" class="tiny">ISBN LOOKUP</text><rect x="172" y="169" width="142" height="29" rx="5" class="outline"/><text x="183" y="188" class="body">Enter ISBN　 Search</text><rect x="16" y="211" width="298" height="169" rx="8" class="soft"/><text x="29" y="234" class="label">Your estimates</text><text x="29" y="260" class="body">Senior resale</text><text x="294" y="260" text-anchor="end" class="label">₹400</text><text x="29" y="284" class="body">Day transfer</text><text x="294" y="284" text-anchor="end" class="label">₹1,000</text><text x="29" y="308" class="body">Dealer pool estimate</text><text x="294" y="308" text-anchor="end" class="label">₹420</text><text x="29" y="332" class="body">Individual scrap estimate</text><text x="294" y="332" text-anchor="end" class="label">₹150</text><text x="29" y="359" class="label">Trust score　50　· eligible threshold 50</text><text x="16" y="397" class="tiny">Illustrative estimates, not guaranteed outcomes.</text></g>
<g id="desktop-marketplace" transform="translate(740 82)"><text x="0" y="0" class="label">DESKTOP / MARKETPLACE</text><rect x="0" y="14" width="330" height="398" rx="14" class="card"/><text x="16" y="40" class="brand">campusloop　/　Marketplace</text><text x="16" y="72" class="heading">Find your next useful thing</text><rect x="16" y="86" width="90" height="29" rx="5" class="soft"/><text x="24" y="104" class="tiny">Category ▾</text><rect x="112" y="86" width="92" height="29" rx="5" class="soft"/><text x="120" y="104" class="tiny">Mode ▾</text><rect x="210" y="86" width="104" height="29" rx="5" class="soft"/><text x="218" y="104" class="tiny">Block A–D ▾</text><rect x="16" y="127" width="298" height="91" rx="8" class="card"/><rect x="28" y="140" width="53" height="62" rx="6" class="sage"/><text x="93" y="151" class="label">Physics textbook</text><text x="93" y="169" class="body">Good · Block A · Senior Resale</text><text x="93" y="186" class="tiny">Owner: Aanya (demo ID)</text><text x="93" y="203" class="label">₹540　 Available</text><rect x="253" y="187" width="49" height="21" rx="5" class="button"/><text x="260" y="201" class="buttontext">Buy</text><rect x="16" y="229" width="298" height="91" rx="8" class="card"/><rect x="28" y="242" width="53" height="62" rx="6" class="sage"/><text x="93" y="253" class="label">Desk lamp</text><text x="93" y="271" class="body">Mint · Block C · Day Transfer</text><text x="93" y="288" class="tiny">Owner: Kabir (demo ID)</text><text x="93" y="305" class="label">₹650　 Available</text><rect x="16" y="331" width="298" height="43" rx="7" class="soft"/><text x="29" y="350" class="label">Purchase confirmation</text><text x="29" y="366" class="tiny">Buyer + owner shown · Payment status: simulated</text><text x="16" y="397" class="tiny">Demo student IDs are not authentication.</text></g>
<g id="desktop-trustlend" transform="translate(1090 82)"><text x="0" y="0" class="label">DESKTOP / TRUSTLEND</text><rect x="0" y="14" width="330" height="398" rx="14" class="card"/><text x="16" y="40" class="brand">campusloop　/　TrustLend</text><text x="16" y="72" class="heading">Borrow with confidence</text><text x="16" y="92" class="body">Choose a seeded demo student; lender is item owner.</text><rect x="16" y="106" width="142" height="34" rx="6" class="soft"/><text x="26" y="128" class="tiny">Borrower: Kabir ▾</text><rect x="172" y="106" width="142" height="34" rx="6" class="soft"/><text x="182" y="128" class="tiny">Eligible item ▾</text><rect x="16" y="153" width="96" height="96" rx="6" class="outline"/><g fill="currentColor"><rect x="25" y="162" width="24" height="24"/><rect x="55" y="162" width="12" height="12"/><rect x="80" y="162" width="23" height="23"/><rect x="25" y="192" width="12" height="12"/><rect x="44" y="190" width="24" height="24"/><rect x="77" y="195" width="26" height="25"/><rect x="27" y="222" width="24" height="18"/><rect x="57" y="222" width="13" height="15"/><rect x="79" y="224" width="23" height="16"/></g><text x="127" y="170" class="label">One-time QR token</text><text x="127" y="190" class="tiny">Readable token fallback</text><text x="127" y="211" class="body">Expires in 24 hours</text><text x="127" y="232" class="tiny">Camera only after scan request</text><rect x="127" y="239" width="162" height="22" rx="5" class="button"/><text x="137" y="254" class="buttontext">Simulate Instant QR Scan (Demo)</text><rect x="16" y="273" width="298" height="59" rx="7" class="soft"/><text x="28" y="294" class="label">Return due in 7 days</text><text x="28" y="314" class="body">Countdown · return action · updated trust score</text><text x="16" y="354" class="label">Incoming / outgoing loan history</text><text x="16" y="375" class="tiny">No identity verification; simulated handover only.</text><text x="16" y="397" class="tiny">No real payment or verified physical exchange.</text></g>
<g id="desktop-dealer-pool" transform="translate(1440 82)"><text x="0" y="0" class="label">DESKTOP / DEALER POOL</text><rect x="0" y="14" width="320" height="398" rx="14" class="card"/><text x="14" y="40" class="brand">campusloop　/　Dealer Pool</text><text x="14" y="69" class="heading">Build a campus batch</text><text x="14" y="89" class="body">Pool estimate vs scrap · owner allocations simulated</text><rect x="14" y="101" width="292" height="36" rx="6" class="soft"/><text x="24" y="117" class="tiny">STAGE 1</text><text x="24" y="131" class="label">Hostel Pickup Scheduled</text><text x="14" y="153" class="tiny">2 items · 2 owners</text><rect x="14" y="161" width="292" height="49" rx="6" class="card"/><text x="24" y="180" class="label">Textbook · Aanya</text><text x="24" y="198" class="tiny">Pool estimate ₹420　/　Scrap ₹150</text><rect x="14" y="217" width="292" height="49" rx="6" class="card"/><text x="24" y="236" class="label">Desk lamp · Kabir</text><text x="24" y="254" class="tiny">Pool estimate ₹210　/　Scrap ₹75</text><text x="14" y="286" class="label">Verified demo dealer bids</text><text x="14" y="305" class="body">Kaveri Recycling Corp　 ₹1,400</text><text x="14" y="322" class="body">Mysuru Book Syndicate　 ₹1,200</text><text x="14" y="339" class="body">Deccan Campus Wholesalers　 ₹900</text><rect x="14" y="348" width="292" height="41" rx="6" class="accent"/><text x="24" y="365" class="tiny">STAGES 2 → 3 → 4</text><text x="24" y="381" class="tiny">Pooled in Campus Batch → Wholesale Dealer Auction Won → Payout Recorded (Simulated)</text><text x="14" y="404" class="tiny">No UPI or payment transfer. Demo allocation only.</text></g>
</g>
<text x="40" y="533" class="heading">Mobile artboards</text><text x="40" y="552" class="body">Stacked single-column layouts · navigation remains available · no pinned story or camera requirement</text>
<g id="mobile-artboards">
<g id="mobile-home" transform="translate(40 570)"><text x="0" y="0" class="label">MOBILE / HOME</text><rect x="0" y="12" width="320" height="520" rx="18" class="card"/><text x="16" y="40" class="brand">campusloop</text><text x="16" y="61" class="tiny">Home　 Valuation　 Marketplace　 More</text><rect x="14" y="77" width="292" height="157" rx="9" class="accent"/><text x="28" y="108" class="tiny">CAMPUS RESOURCES, IN A BETTER LOOP</text><text x="28" y="144" class="heading">Good things</text><text x="28" y="168" class="heading">keep going.</text><text x="28" y="193" class="body">Pass on what you no longer need.</text><rect x="28" y="205" width="100" height="20" rx="5" class="button"/><text x="39" y="219" class="buttontext">Explore the loop</text><text x="16" y="261" class="label">Four paths</text><rect x="14" y="274" width="292" height="44" rx="6" class="soft"/><text x="27" y="301" class="label">Senior Resale</text><rect x="14" y="326" width="292" height="44" rx="6" class="soft"/><text x="27" y="353" class="label">Day Transfer</text><rect x="14" y="378" width="292" height="44" rx="6" class="soft"/><text x="27" y="405" class="label">TrustLend</text><rect x="14" y="430" width="292" height="44" rx="6" class="soft"/><text x="27" y="457" class="label">Dealer Pool</text><text x="16" y="501" class="tiny">Simulated demo · no identity or payment verification</text></g>
<g id="mobile-valuation" transform="translate(390 570)"><text x="0" y="0" class="label">MOBILE / VALUATION</text><rect x="0" y="12" width="320" height="520" rx="18" class="card"/><text x="16" y="40" class="brand">campusloop / Valuation</text><text x="16" y="75" class="heading">Valuation</text><text x="16" y="97" class="body">Choose a category and condition.</text><rect x="14" y="111" width="292" height="37" rx="6" class="soft"/><text x="26" y="134" class="tiny">Category: Academic Book ▾</text><rect x="14" y="156" width="292" height="37" rx="6" class="soft"/><text x="26" y="179" class="tiny">Condition: Mint ▾</text><text x="16" y="216" class="tiny">PRICE ₹　100 ━━━━━●━━━━ 6,000</text><text x="16" y="246" class="tiny">MONTHS　1 ━━━●━━━━━━ 36</text><text x="16" y="276" class="tiny">DAYS　0 ━━●━━━━━━━ 90</text><rect x="14" y="298" width="292" height="178" rx="8" class="soft"/><text x="27" y="324" class="label">Live estimate paths</text><text x="27" y="351" class="body">Senior resale</text><text x="291" y="351" text-anchor="end" class="label">₹400</text><text x="27" y="378" class="body">Day transfer</text><text x="291" y="378" text-anchor="end" class="label">₹1,000</text><text x="27" y="405" class="body">Dealer pool / scrap</text><text x="291" y="405" text-anchor="end" class="label">₹420 / ₹150</text><text x="27" y="440" class="label">Trust 50 · threshold 50</text><text x="16" y="501" class="tiny">ISBN lookup · values are estimates</text></g>
<g id="mobile-marketplace" transform="translate(740 570)"><text x="0" y="0" class="label">MOBILE / MARKETPLACE</text><rect x="0" y="12" width="320" height="520" rx="18" class="card"/><text x="16" y="40" class="brand">campusloop / Marketplace</text><text x="16" y="75" class="heading">Marketplace</text><rect x="14" y="89" width="292" height="31" rx="5" class="soft"/><text x="25" y="109" class="tiny">Category　All ▾</text><rect x="14" y="127" width="292" height="31" rx="5" class="soft"/><text x="25" y="147" class="tiny">Mode　All ▾　 Block　A–D ▾</text><rect x="14" y="170" width="292" height="102" rx="7" class="card"/><text x="27" y="195" class="label">Physics textbook</text><text x="27" y="215" class="body">Good · Block A · Senior Resale</text><text x="27" y="235" class="tiny">Owner: Aanya · demo ID</text><text x="27" y="255" class="label">₹540 · Available</text><rect x="14" y="284" width="292" height="102" rx="7" class="card"/><text x="27" y="309" class="label">Desk lamp</text><text x="27" y="329" class="body">Mint · Block C · Day Transfer</text><text x="27" y="349" class="tiny">Owner: Kabir · demo ID</text><text x="27" y="369" class="label">₹650 · Available</text><rect x="14" y="401" width="292" height="69" rx="7" class="soft"/><text x="26" y="426" class="label">Checkout · buyer + seller</text><text x="26" y="446" class="body">Payment status: simulated</text><text x="16" y="501" class="tiny">Demo student selection is not authentication.</text></g>
<g id="mobile-trustlend" transform="translate(1090 570)"><text x="0" y="0" class="label">MOBILE / TRUSTLEND</text><rect x="0" y="12" width="320" height="520" rx="18" class="card"/><text x="16" y="40" class="brand">campusloop / TrustLend</text><text x="16" y="75" class="heading">Borrow / lend</text><rect x="14" y="89" width="292" height="35" rx="6" class="soft"/><text x="26" y="112" class="tiny">Borrower: demo student ▾</text><rect x="14" y="132" width="292" height="35" rx="6" class="soft"/><text x="26" y="155" class="tiny">Eligible item · owner is lender ▾</text><rect x="14" y="181" width="112" height="112" rx="6" class="outline"/><g fill="currentColor"><rect x="24" y="191" width="25" height="25"/><rect x="55" y="191" width="12" height="12"/><rect x="87" y="191" width="28" height="24"/><rect x="24" y="222" width="13" height="13"/><rect x="44" y="222" width="26" height="26"/><rect x="78" y="221" width="37" height="27"/><rect x="24" y="258" width="28" height="24"/><rect x="61" y="258" width="12" height="15"/><rect x="82" y="258" width="33" height="24"/></g><text x="141" y="207" class="label">QR token</text><text x="141" y="227" class="tiny">Readable token fallback</text><text x="141" y="246" class="body">24-hour expiry</text><text x="16" y="319" class="label">Simulate Instant QR Scan (Demo)</text><rect x="14" y="332" width="292" height="58" rx="7" class="soft"/><text x="26" y="355" class="label">Due in 7 days</text><text x="26" y="375" class="body">Countdown · return · trust refresh</text><text x="16" y="419" class="body">Incoming / outgoing loans</text><text x="16" y="448" class="tiny">Camera optional; permission follows request.</text><text x="16" y="501" class="tiny">No real identity check or money transfer.</text></g>
<g id="mobile-dealer-pool" transform="translate(1440 570)"><text x="0" y="0" class="label">MOBILE / DEALER POOL</text><rect x="0" y="12" width="320" height="520" rx="18" class="card"/><text x="14" y="40" class="brand">campusloop / Dealer Pool</text><text x="14" y="75" class="heading">Campus batch</text><rect x="14" y="88" width="292" height="42" rx="6" class="soft"/><text x="24" y="105" class="tiny">STAGE 1</text><text x="24" y="122" class="label">Hostel Pickup Scheduled</text><text x="14" y="149" class="tiny">Entries · owners · estimates vs scrap</text><rect x="14" y="159" width="292" height="57" rx="6" class="card"/><text x="24" y="181" class="label">Textbook · Aanya</text><text x="24" y="201" class="tiny">Pool ₹420 · Scrap ₹150</text><text x="14" y="240" class="label">Highest-first demo bids</text><text x="14" y="261" class="body">Kaveri Recycling Corp · ₹1,400</text><text x="14" y="281" class="body">Mysuru Book Syndicate · ₹1,200</text><text x="14" y="301" class="body">Deccan Campus Wholesalers · ₹900</text><rect x="14" y="316" width="292" height="42" rx="6" class="soft"/><text x="24" y="333" class="tiny">STAGE 2</text><text x="24" y="350" class="label">Pooled in Campus Batch</text><rect x="14" y="367" width="292" height="42" rx="6" class="soft"/><text x="24" y="384" class="tiny">STAGE 3 · STAGE 4</text><text x="24" y="401" class="tiny">Wholesale Dealer Auction Won</text><text x="24" y="421" class="tiny">Payout Recorded (Simulated)</text><text x="14" y="456" class="body">Allocation is simulated only.</text><text x="14" y="481" class="tiny">No UPI or payment transfer.</text></g>
</g>
</svg>
